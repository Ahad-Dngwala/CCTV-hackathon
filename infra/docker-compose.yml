# Skeleton — see infra/README.md for what gets added and when.
# Only `db` is real right now; everything else follows as the app exists.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data

  # app:
  #   build: ..
  #   depends_on: [db]
  #   ports: ["8000:8000"]

  # mediamtx:
