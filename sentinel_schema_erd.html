<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  DEPARTMENTS ||--o{ CAMERAS : owns
  DISTRICTS |o--o{ CAMERAS : contains
  DEPARTMENTS |o--o{ USERS : employs
  USERS |o--o{ STATUS_HISTORY : changes
  CAMERAS ||--o{ STATUS_HISTORY : has
  CAMERAS ||--o{ DETECTIONS : records
  VEHICLE_TRACKS |o--o{ DETECTIONS : groups
  VEHICLES_WATCHLIST |o--o{ DETECTIONS : tags
  DETECTIONS ||--o{ ALERTS : triggers
  VEHICLES_WATCHLIST ||--o{ ALERTS : "matched by"
  USERS |o--o{ ALERTS : acknowledges
  DEPARTMENTS |o--o{ VEHICLES_WATCHLIST : reports
  USERS |o--o{ VEHICLES_WATCHLIST : adds
  USERS |o--o{ PERSONS_WATCHLIST : adds
  CAMERAS |o--o{ GROUND_TRUTH_ANNOTATIONS : sources
  USERS |o--o{ GROUND_TRUTH_ANNOTATIONS : annotates

  DEPARTMENTS {
    uuid id PK
    text name
    text category
  }
  DISTRICTS {
    uuid id PK
    text name
    geography boundary
  }
  USERS {
    uuid id PK
    text role
    uuid department_id FK
  }
  CAMERAS {
    uuid id PK
    uuid department_id FK
    uuid district_id FK
    geography location
    text connectivity_status
  }
  STATUS_HISTORY {
    uuid id PK
    uuid camera_id FK
    uuid changed_by FK
  }
  VEHICLES_WATCHLIST {
    uuid id PK
    text plate_number
    text category
    text status
  }
  PERSONS_WATCHLIST {
    uuid id PK
    text name
    vector face_embedding
  }
  VEHICLE_TRACKS {
    uuid id PK
    text plate_number
  }
  DETECTIONS {
    uuid id PK
    uuid camera_id FK
    uuid vehicle_track_id FK
    uuid matched_watchlist_id FK
    text detected_plate
    jsonb plate_bbox
  }
  ALERTS {
    uuid id PK
    uuid detection_id FK
    uuid watchlist_id FK
    uuid acknowledged_by FK
    text severity
  }
  GROUND_TRUTH_ANNOTATIONS {
    uuid id PK
    uuid camera_id FK
    text true_plate
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
