<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="eogMarkGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="eogLens" x1="14" y1="14" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer shield / eye boundary -->
  <path d="M5 20C9.5 12 14.8 8.5 20 8.5C25.2 8.5 30.5 12 35 20C30.5 28 25.2 31.5 20 31.5C14.8 31.5 9.5 28 5 20Z" stroke="url(#eogMarkGrad)" stroke-width="2.75" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Gujarat peninsula subtle contour arc / sensor sweep -->
  <path d="M12 18.5C14 13.5 20 12 24.5 14" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Precision aperture ring -->
  <circle cx="20" cy="20" r="7" stroke="url(#eogMarkGrad)" stroke-width="2.2" fill="#0f172a"/>
  <!-- Camera sensor core -->
  <circle cx="20" cy="20" r="3.5" fill="url(#eogLens)"/>
  <circle cx="22" cy="18" r="1.2" fill="#ffffff" opacity="0.9"/>
</svg>
