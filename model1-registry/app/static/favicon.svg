<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="eogGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="11" y1="11" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="8" fill="#0b1329"/>
  <!-- Outer surveillance eye aperture / Gujarat geo contour curve -->
  <path d="M4 16C7.5 9.5 11.8 6.5 16 6.5C20.2 6.5 24.5 9.5 28 16C24.5 22.5 20.2 25.5 16 25.5C11.8 25.5 7.5 22.5 4 16Z" stroke="url(#eogGrad)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Center camera lens / pupil ring -->
  <circle cx="16" cy="16" r="5.5" stroke="url(#eogGrad)" stroke-width="2" fill="#0f172a"/>
  <!-- Center focal eye iris / geo pin -->
  <circle cx="16" cy="16" r="2.8" fill="url(#lensGrad)"/>
  <!-- Top-right active surveillance optical catchlight -->
  <circle cx="18" cy="14" r="1" fill="#ffffff" opacity="0.9"/>
</svg>
