{% extends "base.html" %}

{% block title %}Sentinel — Departments{% endblock %}

{% block content %}
<div class="page-container" x-data="departmentsPage()" x-init="load()">
    <div class="page-header">
        <h1 class="page-title">
            <span class="page-title-icon">🏛️</span> Departments
        </h1>
    </div>

    <div class="table-wrapper">
        <table class="data-table" id="departments-table">
            <thead>
                <tr>
                    <th>Department Name</th>
                    <th>Category</th>
                    <th>Camera Count</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody id="departments-tbody">
                <template x-if="loading">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                            Loading departments...
                        </td>
                    </tr>
                </template>
                <template x-for="dept in departments" :key="dept.id">
                    <tr>
                        <td style="font-weight: 600;" x-text="dept.name"></td>
                        <td>
                            <span class="badge badge--info" x-text="dept.category || '—'"></span>
                        </td>
                        <td>
                            <span style="font-weight: 700; font-size: 1.1rem;" x-text="dept.camera_count"></span>
                            <span style="color: var(--text-muted); font-size: 0.8rem;"> cameras</span>
                        </td>
                        <td style="font-size: 0.8rem; color: var(--text-muted);"
                            x-text="new Date(dept.created_at).toLocaleDateString()">
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function departmentsPage() {
    return {
        departments: [],
        loading: true,
        async load() {
            try {
                const res = await fetch('/api/v1/departments');
                this.departments = await res.json();
            } catch (e) {
                console.error('Failed to load departments:', e);
            } finally {
                this.loading = false;
            }
        }
    };
}
</script>
{% endblock %}
